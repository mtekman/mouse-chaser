# spaceship-cursor configuration

application:
  dead_zone : 100.0 # Do nothing until the green dot moves farther away than this.
  poll_ms : 8 # Update interval, in milliseconds.
  mouse_down_recalc_interval : 5 # While the mousedown, recalculate the route this often. Produces an orbiting effect.
  replan_distance : 100.0
  stationary:
    ticks_required : 10
    radius_beg : 10.0
    radius_end : 20.0
  bezier:
    length_samples : 2 # Number of samples used to estimate each Bezier segment's length
    debug_draw : false  # How far the green dot must move before recalculating a curve.
  default_craft: spaceship

craft:
  spaceship:
    svg:
      chaser: "spaceship"
      cursor: 0 ## 0 to keep cursor, integer for a green cursor, and "crosshair.svg" to replace
    physics_profile: profile1
    fade:
      distance_beg : 1.0   # Fully transparent at or below this distance from the green dot.
      distance_end : 80.0  # Fully opaque at or above this distance from the green dot.
      opacity_min : 0.0   # Minimum opacity when very close to the target. Use 0.15 to retain a faint spaceship near the dot.
    subscribed_events: [RunSwitch]
  ufo:
    svg:
      chaser: "ufo"
      cursor: 0
    physics_profile: profile1
    fade:
      distance_beg : 1.0
      distance_end : 80.0
      opacity_min : 0.0
    
# For each key, entries run in config order: down, periodic hold, then up.
# key accepts an X11 keysym (for example "space") or a mouse button ("Button1").
# craft selects a craft entry; cursor is 0, a numeric marker size, or an SVG name.
event_profile:
  - name: RunSwitch
    key: Button1
    events:
      - type: down
        craft: ufo
        cursor: 0
        physics_profile: profile1
        physics_restore: true
      - type: hold
        every: 100
        craft: ufo
        cursor: 0
        physics_profile: profile1
        physics_restore: true
      - type: hold
        every: 100
        every_offset: 50
        craft: spaceship
        cursor: 0
        physics_profile: profile1
        physics_restore: true
      - type: up
        craft: spaceship
        cursor: 0
        physics_profile: profile1
        physics_restore: true

physics_profile:
  profile1:
    visual:
      size_base : 10
      angle_offset : 0.0
      speed_mult : 1e-3
      accel_mult : 1e-4
      scale_max : 1.5
      elong_max : 1.5
      shape_smooth : 0.4
    linear_motion:
      speed_max : 700.0
      speed_min : 500.0
      speed_drag : 1.2
    bezier:
      waypoint_curve_fraction : 0.1 # 0 : less curvy; higher : more S-curvy. 0.1 feels good.
      start_handle_fraction : 10.0  # High : more drift and broader turns. 10 gives a looser feel.
      start_handle_max : 180.0 # Stops fast movement from creating a massive curve.
      end_handle_fraction : 0.8 # How strongly current momentum carries into a new route. Higher : more drift.
      end_handle_max : 300.0 # Maximum runway used to ease into the target. Low : tighter; high : broader and more graceful.
      min_speed : 700 # Special value: "lin_speed_max" uses linear_motion.speed_max.
      acceleration : 100.0 # Rate at which to meet linear_motion.speed_max.
      
